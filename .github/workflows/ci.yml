name: CI

# CI runs on every branch and PR. The Pages workflow does the same
# build for main / PR previews — this job is the gate, runs typecheck,
# and uploads the dist/ artifact for downstream review.
on:
  push:
    branches-ignore: [gh-pages]
  pull_request:
    branches: [main]

# Force every JavaScript-flavoured action (checkout, setup-node,
# action-setup, upload-artifact …) onto the Node 24 runtime. Without
# this, the runner still warms them on Node 20, which is deprecated
# and slated for removal in Sep 2026.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version is read from package.json's `packageManager` field —
        # don't pass `version:` here or the action errors with
        # ERR_PNPM_BAD_PM_VERSION on the dual-source.

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Production build
        run: pnpm build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist
          retention-days: 7
